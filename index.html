<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pumpkin Night</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <p class="tag">HAPPY HALLOWEEN</p>
      <h1>Pumpkin Night</h1>
      <p id="greeting">Welcome to my Halloween house</p>
    </header>

    <main>
      <button id="pumpkin" type="button">🎃</button>
      <button id="candy" type="button">Candy: 0</button>

      <section class="card">
        <h2>Tonight's spell</h2>
        <p id="spell">Click the button to draw a Halloween wish.</p>
        <button id="spellBtn" type="button">Draw a spell</button>
      </section>

      <h2>My candy bag</h2>
      <ul id="bag">
        <li draggable="true">👻 Ghost marshmallow</li>
        <li draggable="true">🦇 Bat cookie</li>
        <li draggable="true">🍬 Pumpkin candy</li>
      </ul>
      <p id="bin">Drop a sweet here to toss it</p>
    </main>

    <p class="sign">Made by: write your name here</p>
  </div>

  <script src="./script.js"></script>
</body>
</html>
